<!DOCTYPE html>
<!-- Dev-only: all 42 cards in the real card markup + stylesheet, for art review.
     Not linked from the game. Open http://localhost:5173/tools/dev/card-gallery.html -->
<html lang="en"><head><meta charset="utf-8"><title>Ember Ascent — card gallery</title>
<link rel="stylesheet" href="../../web/fonts/fonts.css"><link rel="stylesheet" href="../../web/style.css">
<style>.gal{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;padding:20px}.gal .card{cursor:default}h1{font-family:Cinzel,serif;color:#ffcf6b;text-align:center;font-size:20px;letter-spacing:.2em}</style></head>
<body><div id="app"><h1>EMBER ASCENT · 42 CARDS</h1><div class="gal" id="g"></div></div>
<script type="module">
import { cardArtMarkup } from '../../web/card-art.js';
import { describeCard, CARD_TYPE_LABEL } from '../../src/kernel/describe.js';
import { SHIPPED_CONTENT } from '../../src/kernel/content.js';
const C = SHIPPED_CONTENT; const list = Array.isArray(C) ? C : (C.cards || Object.values(C));
const g = document.getElementById('g');
for (const d of list) {
  const b = document.createElement('div'); b.className = `card type-${d.type} has-illus`;
  const lbl = (CARD_TYPE_LABEL[d.type]?.label ?? CARD_TYPE_LABEL[d.type] ?? d.type);
  b.innerHTML = `<span class="cost-gem"><span class="gem-core"></span></span><span class="ctype"><span class="c-illus">${cardArtMarkup(d.id)}</span><span class="c-type-mark"><svg viewBox="0 0 20 20"></svg></span><span></span></span><span class="cname"></span><span class="cdesc"></span>`;
  b.querySelector('.gem-core').textContent = d.cost;
  b.querySelector('.ctype > span:last-child').textContent = typeof lbl === 'string' ? lbl : d.type;
  b.querySelector('.cname').textContent = d.name;
  let desc = ''; try { desc = describeCard(d); desc = desc.text || desc.description || desc; } catch {}
  b.querySelector('.cdesc').textContent = typeof desc === 'string' ? desc : '';
  g.append(b);
}
</script></body></html>
