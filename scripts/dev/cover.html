<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Ember Ascent — cover</title>
<style>
  /* Cover art for the itch.io page, rendered from the GAME'S OWN palette (copied verbatim
     from web/style.css) and the game's own SVG glyph vocabulary (web/app.js GLYPHS), so the
     store image cannot drift from the product. Sized 1260x1000 = itch.io's recommended
     630x500 at 2x for a crisp upload. No image files, no fonts, no network. */
  :root {
    --ground: #0a0c12;
    --raised: #141a26;
    --edge: #2a3348;
    --ink: #eef1f8;
    --dim: #98a2bd;
    --faint: #656e88;
    --gold: #f5c542;
    --hp: #e2504c;
    --block: #5fa8dc;
    --attack: #d96a58;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1260px; height: 1000px; overflow: hidden; }
  body {
    background:
      radial-gradient(900px 620px at 50% 34%, rgba(245, 197, 66, 0.10), rgba(245, 197, 66, 0) 70%),
      radial-gradient(700px 500px at 50% 96%, rgba(226, 80, 76, 0.12), rgba(226, 80, 76, 0) 72%),
      var(--ground);
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    position: relative;
  }

  /* A faint sigil behind everything, echoing the in-game watermark. */
  .sigil {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -58%);
    width: 620px; opacity: 0.05; color: var(--ink);
  }
  .sigil svg { width: 100%; display: block; }

  .kicker {
    font-size: 20px; letter-spacing: 0.42em; text-transform: uppercase;
    color: var(--faint); font-weight: 800; margin-bottom: 22px; position: relative;
  }
  h1 {
    font-size: 104px; font-weight: 900; letter-spacing: 0.02em; line-height: 0.98;
    text-align: center; position: relative;
    color: var(--gold);
    text-shadow: 0 0 60px rgba(245, 197, 66, 0.35), 0 6px 0 rgba(0, 0, 0, 0.45);
  }
  h1 .light { color: var(--ink); }

  .rule {
    width: 300px; height: 3px; margin: 26px 0 22px; position: relative;
    background: linear-gradient(90deg, rgba(245,197,66,0), var(--gold), rgba(245,197,66,0));
  }

  .tagline {
    font-size: 30px; color: var(--dim); text-align: center; font-weight: 600;
    letter-spacing: 0.01em; position: relative; max-width: 900px; line-height: 1.35;
  }
  .tagline b { color: var(--ink); font-weight: 800; }

  /* The stat strip: real numbers from the shipped build (42 cards measured, one act,
     one boss). A store image that lies about the content is a refund request. */
  .stats {
    display: flex; gap: 46px; margin-top: 44px; position: relative;
    align-items: flex-start;
  }
  .stat { text-align: center; }
  .stat .n {
    font-size: 46px; font-weight: 900; color: var(--gold); line-height: 1;
    font-variant-numeric: tabular-nums;
  }
  .stat .l {
    font-size: 15px; letter-spacing: 0.2em; text-transform: uppercase;
    color: var(--faint); font-weight: 800; margin-top: 8px;
  }

  /* A small hand of cards, tilted, so the image reads as a card game at a glance. */
  .hand { position: absolute; bottom: -22px; display: flex; gap: 0; align-items: flex-end; }
  .mini {
    width: 138px; height: 178px; border-radius: 12px; margin: 0 -10px;
    background: linear-gradient(180deg, #1b2231, #121722);
    border: 2px solid var(--edge);
    box-shadow: 0 14px 34px rgba(0, 0, 0, 0.6);
    display: flex; flex-direction: column; align-items: center; gap: 6px;
    padding: 12px 8px; position: relative;
  }
  .mini .gem {
    width: 26px; height: 26px; border-radius: 50%; align-self: flex-start;
    background: radial-gradient(circle at 35% 30%, #ffe08a, var(--gold));
    border: 2px solid #0c0f16; font-weight: 900; color: #1a1305;
    display: grid; place-items: center; font-size: 15px;
  }
  .mini .nm { font-weight: 800; font-size: 17px; color: var(--ink); }
  .mini .tx { font-size: 12.5px; color: var(--dim); text-align: center; line-height: 1.3; }
  .mini:first-child { transform: rotate(-8deg) translate(-14px, 12px); }
  .mini:last-child { transform: rotate(8deg) translate(14px, 12px); }
  .mini.a { border-color: var(--attack); }
  .mini.s { border-color: var(--block); }
  .mini.g { border-color: var(--gold); }
</style>
</head>
<body>
  <div class="sigil" aria-hidden="true">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.1"
         stroke-linecap="round" stroke-linejoin="round"><path d="M8 20h8M12 20V9M12 9c0-3 2-5 4-6 0 3-1 5-4 6zM12 12c-3-1-5-3-5-6 3 1 5 3 5 6z"/></svg>
  </div>

  <div class="kicker">Roguelike deckbuilder</div>
  <h1>EMBER<br /><span class="light">ASCENT</span></h1>
  <div class="rule"></div>
  <p class="tagline">A short, <b>brutal</b> roguelike deckbuilder.<br />One act. One boss. Good luck.</p>

  <div class="stats">
    <div class="stat"><div class="n">42</div><div class="l">Cards</div></div>
    <div class="stat"><div class="n">1</div><div class="l">Act</div></div>
    <div class="stat"><div class="n">8</div><div class="l">Floors</div></div>
    <div class="stat"><div class="n">1</div><div class="l">Boss</div></div>
  </div>

  <div class="hand" aria-hidden="true">
    <div class="mini s"><div class="gem">1</div><div class="nm">Quench</div><div class="tx">Gain 5 Block.</div></div>
    <div class="mini a"><div class="gem">1</div><div class="nm">Hammerfall</div><div class="tx">Deal 6 damage.</div></div>
    <div class="mini g"><div class="gem">2</div><div class="nm">Anvil Blow</div><div class="tx">Deal 8 damage.<br />Apply 2 Vulnerable.</div></div>
    <div class="mini a"><div class="gem">1</div><div class="nm">Hammerfall</div><div class="tx">Deal 6 damage.</div></div>
    <div class="mini s"><div class="gem">1</div><div class="nm">Quench</div><div class="tx">Gain 5 Block.</div></div>
  </div>
</body>
</html>
