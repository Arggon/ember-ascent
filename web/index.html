<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ember Ascent — a roguelike deckbuilder</title>
  <meta name="description" content="A short, brutal roguelike deckbuilder. 42 cards, one act, one boss. Playable in your browser with no install and no network calls." />
  <meta name="color-scheme" content="dark" />
  <!-- Zero dependencies of any kind: one local stylesheet, one local ES module, both
       served from this same origin. No remote assets, no build step. -->
  <link rel="stylesheet" href="./fonts/fonts.css" />
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <!--
    A VIEW on the SAME kernel the headless CLI drives. This page contains no game
    rules: every number and label it shows comes from controller.snapshot(), which the
    kernel computes. See src/surface/gui/controller.js and src/kernel/observe.js.
  -->
  <div id="app">
    <header id="hud" aria-label="Player status"></header>
    <main id="stage" aria-live="polite"></main>
    <!--
      The EFFECT LAYER. This is the whole answer to the repaint problem: `render()`
      rebuilds #stage from scratch after every action, which destroys any node that is
      mid-animation. This layer is a SIBLING of #stage and is therefore never rebuilt, so
      it can carry effects that must outlive a repaint (a card flying to its target, a
      screen wipe, the player-damage vignette).

      Floating damage numbers do NOT live here: they are appended inside the enemy card
      that was hit (`enemyCard()` appends an `.efx` box), so a floater can never land on
      the wrong enemy and needs no geometry measurement at all.

      aria-hidden: nothing here is a source of truth. Every fact an effect conveys (the new
      HP, the block that was eaten, the status that landed) is ALSO written statically into
      the HUD or the enemy card, so reduced motion and a screen reader lose no information.
    -->
    <div id="fx-layer" aria-hidden="true"></div>
    <div id="toast" role="status" aria-live="polite"></div>
    <!-- Announcements for players who cannot see the targeting step. `polite` so a
         message never interrupts the enemy's own intent being read out. -->
    <div id="live" role="status" aria-live="polite"></div>
  </div>
  <noscript>This game needs JavaScript modules enabled.</noscript>
  <script type="module" src="./app.js"></script>
</body>
</html>
